<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Subjects</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openAddSubjectModal()">
        <ion-icon name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Subjects</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- 🔍 Search + Sort Row -->
  <ion-item>
    <ion-searchbar [(ngModel)]="searchText" (ionInput)="filterSubjects()" placeholder="Search Subjects"
      class="flex-grow">
    </ion-searchbar>

    <ion-button fill="clear" (click)="openSortOptions()">
      <ion-icon slot="icon-only" name="swap-vertical-outline"></ion-icon>
    </ion-button>
  </ion-item>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let subject of filteredSubjects">
        <ion-card (click)="openSubjectDetail(subject)">
          <ion-card-header>
            <ion-item lines="none">
              <ion-label>
                <ion-card-title>{{ subject?.name }}</ion-card-title>
                <ion-card-subtitle>
                  Name : {{ subject?.name }}<br>
                  Code: {{ subject?.code }} <br>
                  Description: {{ subject?.description }}<br>
                  Status: {{ subject?.status }}
                </ion-card-subtitle>
              </ion-label>
            </ion-item>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>
