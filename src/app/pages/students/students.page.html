<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Students</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openAddStudentModal()">
        <ion-icon name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Students</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- 🔍 Search + Sort Row -->
  <ion-item>
    <ion-searchbar [(ngModel)]="searchText" (ionInput)="filterStudents()" placeholder="Search Students"
      class="flex-grow">
    </ion-searchbar>

    <ion-button fill="clear" (click)="openSortOptions()">
      <ion-icon slot="icon-only" name="swap-vertical-outline"></ion-icon>
    </ion-button>
  </ion-item>
